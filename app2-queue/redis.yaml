apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-queue
  namespace: app2
spec:
  replicas: 1
  selector: {matchLabels: {app: redis-queue}}
  template:
    metadata: {labels: {app: redis-queue}}
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        resources:
          requests: {memory: "32Mi", cpu: "50m"}
          limits:   {memory: "128Mi", cpu: "200m"}
        ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: redis-queue, namespace: app2}
spec:
  selector: {app: redis-queue}
  ports: [{port: 6379, targetPort: 6379}]
