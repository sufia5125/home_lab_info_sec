apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-shop
  namespace: app1
spec:
  replicas: 1
  selector: {matchLabels: {app: db-shop}}
  template:
    metadata: {labels: {app: db-shop}}
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        resources:
          requests: {memory: "32Mi", cpu: "50m"}
          limits:   {memory: "128Mi", cpu: "200m"}
        ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: db-shop, namespace: app1}
spec:
  selector: {app: db-shop}
  ports: [{port: 6379, targetPort: 6379}]
