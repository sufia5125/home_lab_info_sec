apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-shop
  namespace: app1
spec:
  replicas: 4
  selector: {matchLabels: {app: api-shop}}
  template:
    metadata: {labels: {app: api-shop}}
    spec:
      containers:
      - name: api
        image: python:3.11-slim
        command: ["python", "/app/api.py"]
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: WORKLOAD_NAME
          value: "api-shop"
        resources:
          requests: {memory: "32Mi", cpu: "50m"}
          limits:   {memory: "128Mi", cpu: "200m"}
        volumeMounts:
        - name: script
          mountPath: /app
        - name: logs
          mountPath: /var/log/app
        ports: [{containerPort: 8000}]
      volumes:
      - name: script
        configMap: {name: api-shop-script}
      - name: logs
        hostPath:
          path: /home/sufia/IS/ddos-lab/data/app-events
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata: {name: api-shop, namespace: app1}
spec:
  selector: {app: api-shop}
  ports: [{port: 8000, targetPort: 8000}]
